<!doctype html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">

  <meta
    name="description"
    content="وبسایت شرکت تعاونی عشایری کوه نور به آدرس جدید منتقل شده است."
  >

  <title>شرکت تعاونی عشایری کوه نور</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


<style>

/* =========================================================
   BASE
========================================================= */

:root {
  --blue: #082d9c;
  --blue2: #1b50c8;
  --ink: #102044;
  --muted: #69758b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;

  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  min-height: 100%;
}

body {

  min-height: 100svh;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(8,45,156,.045),
      transparent 42%
    ),
    #fff;

  color: var(--ink);

  font-family:
    "Vazirmatn",
    Tahoma,
    Arial,
    sans-serif;
}


/* =========================================================
   BACKGROUND ANIMATION
========================================================= */

#cosmos {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0;

  pointer-events: none;

  opacity: .42;
}


/* very soft blue cosmic glow */

.cosmic-glow {

  position: fixed;

  width: 620px;
  height: 620px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(26,76,190,.055),
      rgba(26,76,190,.018) 35%,
      transparent 70%
    );

  filter: blur(28px);

  z-index: 0;

  pointer-events: none;

  animation:
    glowPulse
    12s
    ease-in-out
    infinite;
}


/* =========================================================
   CONTENT
========================================================= */

.page {

  position: relative;

  z-index: 10;

  width:
    min(
      760px,
      calc(100% - 30px)
    );

  min-height: 100svh;

  margin: auto;

  display: flex;

  flex-direction: column;

  justify-content: center;

  align-items: center;

  text-align: center;

  padding:
    24px 0
    calc(
      24px +
      env(safe-area-inset-bottom)
    );

  animation:
    pageIn
    1.1s
    cubic-bezier(.16,1,.3,1)
    both;
}


/* =========================================================
   SMALL COSMIC / WEB SYMBOL
========================================================= */

.cosmic-mark {

  position: relative;

  width: 82px;
  height: 82px;

  margin-bottom: 28px;

  display: grid;

  place-items: center;

  animation:
    markIn
    1.1s
    .1s
    cubic-bezier(.16,1,.3,1)
    both;
}


/* outer web orbit */

.cosmic-mark::before {

  content: "";

  position: absolute;

  inset: 4px;

  border:
    1px solid
    rgba(8,45,156,.13);

  border-radius: 50%;

  animation:
    rotateSlow
    18s
    linear
    infinite;
}


/* second orbit */

.cosmic-mark::after {

  content: "";

  position: absolute;

  width: 67px;
  height: 78px;

  border:
    1px dashed
    rgba(8,45,156,.10);

  border-radius: 50%;

  transform:
    rotate(55deg);

  animation:
    rotateReverse
    23s
    linear
    infinite;
}


/* center */

.mark-core {

  position: relative;

  width: 53px;
  height: 53px;

  display: grid;

  place-items: center;

  border:
    1px solid
    rgba(8,45,156,.18);

  border-radius: 50%;

  background:
    rgba(255,255,255,.82);

  box-shadow:
    0 14px 40px
    rgba(8,45,156,.08);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  animation:
    coreFloat
    5s
    ease-in-out
    infinite;
}


/* web / connection symbol */

.web-symbol {

  position: relative;

  width: 23px;
  height: 23px;

  border:
    2px solid
    var(--blue);

  border-radius: 50%;

  opacity: .92;
}


/* horizontal web line */

.web-symbol::before {

  content: "";

  position: absolute;

  left: 3px;
  right: 3px;

  top: 9px;

  height: 2px;

  background:
    var(--blue);

  border-radius: 10px;
}


/* connection point */

.web-symbol::after {

  content: "";

  position: absolute;

  width: 6px;
  height: 6px;

  right: -4px;
  top: 2px;

  border-radius: 50%;

  background:
    var(--blue);

  box-shadow:
    0 0 12px
    rgba(8,45,156,.35);
}


/* =========================================================
   TEXT
========================================================= */

h1 {

  max-width: 690px;

  font-size:
    clamp(
      25px,
      5.8vw,
      40px
    );

  line-height: 1.72;

  font-weight: 600;

  letter-spacing: -1px;

  opacity: 0;

  animation:
    textIn
    .9s
    .38s
    cubic-bezier(.16,1,.3,1)
    forwards;
}


.message {

  max-width: 600px;

  margin:
    10px auto
    27px;

  color:
    var(--muted);

  font-size:
    clamp(
      14px,
      2.8vw,
      17px
    );

  line-height: 2.15;

  opacity: 0;

  animation:
    textIn
    .9s
    .53s
    cubic-bezier(.16,1,.3,1)
    forwards;
}


/* =========================================================
   BUTTON
========================================================= */

.button-wrap {

  position: relative;

  opacity: 0;

  animation:
    buttonIn
    .9s
    .68s
    cubic-bezier(.16,1,.3,1)
    forwards;
}


.button-glow {

  position: absolute;

  inset: -12px;

  border-radius: 22px;

  background:
    rgba(8,45,156,.055);

  filter:
    blur(15px);

  animation:
    buttonGlow
    6s
    ease-in-out
    infinite;
}


.new-address {

  position: relative;

  z-index: 2;

  width:
    min(
      330px,
      calc(100vw - 52px)
    );

  height: 56px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 17px;

  background:
    linear-gradient(
      135deg,
      #082d9c,
      #174dca
    );

  color: white;

  text-decoration: none;

  font-size: 15px;

  font-weight: 600;

  box-shadow:
    0 15px 38px
    rgba(8,45,156,.18);

  overflow: hidden;

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}


/* subtle light sweep */

.new-address::before {

  content: "";

  position: absolute;

  top: 0;
  left: -120%;

  width: 65%;
  height: 100%;

  background:
    linear-gradient(
      100deg,
      transparent,
      rgba(255,255,255,.22),
      transparent
    );

  transform:
    skewX(-20deg);

  animation:
    buttonShine
    7s
    ease-in-out
    infinite;
}


.button-text {

  position: relative;

  z-index: 2;
}


.new-address:active {

  transform:
    scale(.97);
}


/* =========================================================
   DOMAIN
========================================================= */

.url {

  direction: ltr;

  margin-top: 14px;

  color:
    #8994ac;

  font-size: 12px;

  letter-spacing: .2px;

  opacity: 0;

  animation:
    fadeIn
    .8s
    .95s
    ease
    forwards;
}


/* =========================================================
   DATE BOX
========================================================= */

.date-box {

  position: relative;

  margin-top: 25px;

  min-width: 145px;

  height: 42px;

  padding:
    0 18px;

  display: flex;

  align-items: center;

  justify-content: center;

  direction: ltr;

  border:
    1px solid
    rgba(8,45,156,.15);

  border-radius: 12px;

  background:
    rgba(255,255,255,.86);

  color:
    #52617d;

  font-size: 13px;

  font-weight: 500;

  letter-spacing: 1px;

  box-shadow:
    0 10px 30px
    rgba(8,45,156,.055);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  opacity: 0;

  animation:
    dateIn
    .8s
    1.08s
    cubic-bezier(.16,1,.3,1)
    forwards;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes pageIn {

  from {
    opacity: 0;

    transform:
      translateY(18px)
      scale(.99);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes markIn {

  from {
    opacity: 0;

    transform:
      scale(.55)
      rotate(-25deg);
  }

  to {
    opacity: 1;

    transform:
      scale(1)
      rotate(0);
  }
}


@keyframes rotateSlow {

  from {
    transform:
      rotate(0);
  }

  to {
    transform:
      rotate(360deg);
  }
}


@keyframes rotateReverse {

  from {
    transform:
      rotate(55deg);
  }

  to {
    transform:
      rotate(-305deg);
  }
}


@keyframes coreFloat {

  0%,100% {
    transform:
      translateY(0);
  }

  50% {
    transform:
      translateY(-4px);
  }
}


@keyframes textIn {

  from {
    opacity: 0;

    transform:
      translateY(13px);
  }

  to {
    opacity: 1;

    transform:
      translateY(0);
  }
}


@keyframes buttonIn {

  from {
    opacity: 0;

    transform:
      translateY(15px)
      scale(.96);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes dateIn {

  from {
    opacity: 0;

    transform:
      translateY(10px)
      scale(.96);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}


@keyframes fadeIn {

  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}


@keyframes glowPulse {

  0%,100% {
    opacity: .55;

    transform:
      translate(-50%,-50%)
      scale(.94);
  }

  50% {
    opacity: .9;

    transform:
      translate(-50%,-50%)
      scale(1.06);
  }
}


@keyframes buttonGlow {

  0%,100% {
    opacity: .25;

    transform:
      scale(.97);
  }

  50% {
    opacity: .6;

    transform:
      scale(1.035);
  }
}


@keyframes buttonShine {

  0%,
  50% {
    left: -120%;
  }

  75%,
  100% {
    left: 150%;
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:520px) {

  .page {

    width:
      calc(100% - 28px);

    padding:
      18px 0
      calc(
        18px +
        env(safe-area-inset-bottom)
      );
  }


  .cosmic-mark {

    width: 76px;
    height: 76px;

    margin-bottom: 21px;
  }


  .mark-core {

    width: 50px;
    height: 50px;
  }


  h1 {

    max-width: 355px;

    font-size: 25px;

    line-height: 1.78;
  }


  .message {

    max-width: 350px;

    margin:
      7px auto
      22px;

    font-size: 14px;

    line-height: 2.08;
  }


  .new-address {

    height: 55px;

    border-radius: 16px;
  }


  .date-box {

    margin-top: 23px;

    min-width: 145px;

    height: 41px;
  }


  /*
     Background animation becomes
     even softer on phones.
  */

  #cosmos {

    opacity: .27;
  }


  .cosmic-glow {

    opacity: .65;
  }
}


/* =========================================================
   SMALL HEIGHT DEVICES
========================================================= */

@media (max-height:680px) {

  .cosmic-mark {

    transform:
      scale(.82);

    margin-bottom: 7px;
  }


  h1 {

    font-size: 22px;
  }


  .message {

    margin-bottom: 15px;

    font-size: 13px;
  }


  .date-box {

    margin-top: 18px;
  }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion:reduce) {

  *,
  *::before,
  *::after {

    animation:
      none !important;

    transition:
      none !important;
  }


  h1,
  .message,
  .button-wrap,
  .url,
  .date-box {

    opacity: 1 !important;
  }
}

</style>

</head>


<body>


<!-- =========================================================
     BACKGROUND
========================================================= -->

<canvas id="cosmos"></canvas>

<div class="cosmic-glow"></div>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="page">


  <!-- Cosmic / Internet mark -->

  <div class="cosmic-mark">

    <div class="mark-core">

      <div class="web-symbol"></div>

    </div>

  </div>


  <!-- Title -->

  <h1>
    وبسایت شرکت به آدرس زیر تغییر پیدا کرد.
  </h1>


  <!-- Message -->

  <p class="message">
    برای ورود به وبسایت جدید شرکت، روی دکمه زیر کلیک کنید.
  </p>


  <!-- Button -->

  <div class="button-wrap">

    <div class="button-glow"></div>

    <a
      class="new-address"
      href="https://taavonikohnoor.ir/"
      aria-label="ورود به وبسایت جدید شرکت"
    >

      <span class="button-text">
        کلیک کنید!
      </span>

    </a>

  </div>


  <!-- Domain -->

  <div class="url">
    taavonikohnoor.ir
  </div>


  <!-- ONLY DATE BOX -->

  <div
    class="date-box"
    id="persianDate"
  >
    ۱۷/۰۶/۱۴۰۵
  </div>


</main>


<script>

/* =========================================================
   COSMIC + INTERNET BACKGROUND
========================================================= */

(() => {

  const canvas =
    document.getElementById("cosmos");

  const ctx =
    canvas.getContext("2d");

  let width;
  let height;
  let dpr;

  let stars = [];

  let planets = [];

  let nodes = [];

  let packets = [];

  let last = 0;


  /* -------------------------------------------------------
     Resize
  ------------------------------------------------------- */

  function resize() {

    width =
      window.innerWidth;

    height =
      window.innerHeight;

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    canvas.width =
      width * dpr;

    canvas.height =
      height * dpr;

    canvas.style.width =
      width + "px";

    canvas.style.height =
      height + "px";


    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );


    createStars();

    createNodes();

    createPlanets();

  }


  /* -------------------------------------------------------
     Stars
  ------------------------------------------------------- */

  function createStars() {

    stars = [];

    const count =
      width < 600
        ? 130
        : 230;


    for (
      let i = 0;
      i < count;
      i++
    ) {

      stars.push({

        x:
          Math.random() * width,

        y:
          Math.random() * height,

        r:
          Math.random() *
          1.05 +
          .2,

        a:
          Math.random() *
          .22 +
          .025,

        phase:
          Math.random() *
          Math.PI * 2,

        speed:
          Math.random() *
          .001 +
          .0002

      });

    }

  }


  /* -------------------------------------------------------
     Internet nodes
  ------------------------------------------------------- */

  function createNodes() {

    nodes = [];

    const count =
      width < 600
        ? 14
        : 22;


    for (
      let i = 0;
      i < count;
      i++
    ) {

      nodes.push({

        x:
          width * .08 +
          Math.random() *
          width * .84,

        y:
          height * .12 +
          Math.random() *
          height * .76,

        r:
          Math.random() *
          1.8 +
          .7,

        phase:
          Math.random() *
          Math.PI * 2

      });

    }

  }


  /* -------------------------------------------------------
     Planets
  ------------------------------------------------------- */

  function createPlanets() {

    planets = [];

    planets.push({

      type:
        "saturn",

      angle:
        Math.random() *
        Math.PI * 2,

      radius:
        Math.min(width,height) *
        .34,

      size:
        width < 600
          ? 13
          : 18,

      speed:
        .00010

    });


    planets.push({

      type:
        "jupiter",

      angle:
        Math.PI +
        Math.random(),

      radius:
        Math.min(width,height) *
        .43,

      size:
        width < 600
          ? 10
          : 15,

      speed:
        -.000065

    });

  }


  /* -------------------------------------------------------
     Draw stars
  ------------------------------------------------------- */

  function drawStars(time) {

    stars.forEach(
      star => {

        const pulse =
          .7 +
          Math.sin(
            time * star.speed +
            star.phase
          ) * .3;


        ctx.beginPath();

        ctx.arc(
          star.x,
          star.y,
          star.r,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(30,75,170,${
            star.a * pulse
          })`;

        ctx.fill();

      }
    );

  }


  /* -------------------------------------------------------
     Draw internet network
  ------------------------------------------------------- */

  function drawNetwork(time) {

    /*
     * Very subtle connections.
     */

    for (
      let i = 0;
      i < nodes.length;
      i++
    ) {

      for (
        let j = i + 1;
        j < nodes.length;
        j++
      ) {

        const a =
          nodes[i];

        const b =
          nodes[j];


        const dx =
          a.x - b.x;

        const dy =
          a.y - b.y;

        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        if (
          distance < 170
        ) {

          const opacity =
            (1 -
              distance / 170) *
            .065;


          ctx.beginPath();

          ctx.moveTo(
            a.x,
            a.y
          );

          ctx.lineTo(
            b.x,
            b.y
          );


          ctx.strokeStyle =
            `rgba(25,73,170,${opacity})`;

          ctx.lineWidth =
            .7;

          ctx.stroke();

        }

      }

    }


    /*
     * Nodes
     */

    nodes.forEach(
      node => {

        const pulse =
          .65 +
          Math.sin(
            time * .001 +
            node.phase
          ) * .35;


        ctx.beginPath();

        ctx.arc(
          node.x,
          node.y,
          node.r,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(20,65,165,${
            .10 * pulse
          })`;

        ctx.fill();


        /*
         * tiny node glow
         */

        ctx.beginPath();

        ctx.arc(
          node.x,
          node.y,
          node.r * 3.2,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(45,90,190,${
            .018 * pulse
          })`;

        ctx.fill();

      }
    );


    /*
     * Data packets moving
     * through the network.
     */

    if (
      Math.random() < .018
    ) {

      const a =
        nodes[
          Math.floor(
            Math.random() *
            nodes.length
          )
        ];


      let b =
        nodes[
          Math.floor(
            Math.random() *
            nodes.length
          )
        ];


      if (
        a === b
      ) return;


      packets.push({

        x:
          a.x,

        y:
          a.y,

        tx:
          b.x,

        ty:
          b.y,

        progress:
          0,

        speed:
          .004 +
          Math.random() * .004

      });

    }


    packets =
      packets.filter(
        packet =>
          packet.progress < 1
      );


    packets.forEach(
      packet => {

        packet.progress +=
          packet.speed;


        const x =
          packet.x +
          (
            packet.tx -
            packet.x
          ) *
          packet.progress;


        const y =
          packet.y +
          (
            packet.ty -
            packet.y
          ) *
          packet.progress;


        ctx.beginPath();

        ctx.arc(
          x,
          y,
          1.2,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "rgba(35,86,190,.18)";

        ctx.fill();

      }
    );

  }


  /* -------------------------------------------------------
     Jupiter
  ------------------------------------------------------- */

  function drawJupiter(
    x,
    y,
    size
  ) {

    const gradient =
      ctx.createRadialGradient(
        x - size * .3,
        y - size * .3,
        1,
        x,
        y,
        size
      );


    gradient.addColorStop(
      0,
      "rgba(225,230,240,.55)"
    );

    gradient.addColorStop(
      1,
      "rgba(125,145,180,.18)"
    );


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      gradient;

    ctx.fill();

  }


  /* -------------------------------------------------------
     Saturn
  ------------------------------------------------------- */

  function drawSaturn(
    x,
    y,
    size,
    angle
  ) {

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      angle
    );

    ctx.scale(
      1,
      .34
    );


    /*
     * Ring
     */

    ctx.beginPath();

    ctx.ellipse(
      0,
      0,
      size * 1.9,
      size * .75,
      0,
      0,
      Math.PI * 2
    );


    ctx.strokeStyle =
      "rgba(65,95,160,.14)";

    ctx.lineWidth =
      size * .15;

    ctx.stroke();


    ctx.restore();


    /*
     * Planet
     */

    const gradient =
      ctx.createRadialGradient(
        x - size * .3,
        y - size * .35,
        1,
        x,
        y,
        size
      );


    gradient.addColorStop(
      0,
      "rgba(238,241,247,.58)"
    );

    gradient.addColorStop(
      1,
      "rgba(130,148,180,.20)"
    );


    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      gradient;

    ctx.fill();

  }


  /* -------------------------------------------------------
     Galaxy haze
  ------------------------------------------------------- */

  function drawGalaxy() {

    const cx =
      width / 2;

    const cy =
      height / 2;


    ctx.save();

    ctx.translate(
      cx,
      cy
    );

    ctx.rotate(
      -.18
    );

    ctx.scale(
      1,
      .32
    );


    const radius =
      Math.min(
        width,
        height
      ) * .65;


    const gradient =
      ctx.createRadialGradient(
        0,
        0,
        0,
        0,
        0,
        radius
      );


    gradient.addColorStop(
      0,
      "rgba(40,82,185,.055)"
    );

    gradient.addColorStop(
      .28,
      "rgba(40,82,185,.025)"
    );

    gradient.addColorStop(
      1,
      "rgba(40,82,185,0)"
    );


    ctx.fillStyle =
      gradient;


    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.restore();

  }


  /* -------------------------------------------------------
     Main animation
  ------------------------------------------------------- */

  function animate(time) {

    ctx.clearRect(
      0,
      0,
      width,
      height
    );


    drawGalaxy();

    drawStars(time);

    drawNetwork(time);


    const cx =
      width / 2;

    const cy =
      height / 2;


    /*
     * Planets orbit very slowly
     * in the background.
     */

    planets.forEach(
      planet => {

        const angle =
          planet.angle +
          time *
          planet.speed;


        const x =
          cx +
          Math.cos(angle) *
          planet.radius;


        const y =
          cy +
          Math.sin(angle) *
          planet.radius *
          .38;


        if (
          planet.type ===
          "saturn"
        ) {

          drawSaturn(
            x,
            y,
            planet.size,
            angle * .3
          );

        }


        if (
          planet.type ===
          "jupiter"
        ) {

          drawJupiter(
            x,
            y,
            planet.size
          );

        }

      }
    );


    last = time;


    requestAnimationFrame(
      animate
    );

  }


  window.addEventListener(
    "resize",
    resize,
    {
      passive: true
    }
  );


  resize();

  requestAnimationFrame(
    animate
  );

})();


/* =========================================================
   AUTOMATIC PERSIAN DATE — IRAN
========================================================= */

(() => {

  const dateElement =
    document.getElementById(
      "persianDate"
    );


  /*
   * Convert Latin digits
   * to Persian digits.
   */

  function toPersianDigits(
    value
  ) {

    return String(value)
      .replace(
        /\d/g,
        digit =>
          "۰۱۲۳۴۵۶۷۸۹"[digit]
      );

  }


  /*
   * Get Persian date using
   * Tehran timezone.
   *
   * The browser's Intl API supports
   * the Persian calendar.
   */

  function getPersianDate() {

    const formatter =
      new Intl.DateTimeFormat(
        "en-US-u-ca-persian-nu-latn",
        {
          timeZone:
            "Asia/Tehran",

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit"
        }
      );


    const parts =
      formatter.formatToParts(
        new Date()
      );


    let year = "";
    let month = "";
    let day = "";


    for (
      const part of parts
    ) {

      if (
        part.type ===
        "year"
      ) {

        year =
          part.value;

      }


      if (
        part.type ===
        "month"
      ) {

        month =
          part.value;

      }


      if (
        part.type ===
        "day"
      ) {

        day =
          part.value;

      }

    }


    return (
      day.padStart(2, "0") +
      "/" +
      month.padStart(2, "0") +
      "/" +
      year.padStart(4, "0")
    );

  }


  function updateDate() {

    try {

      const date =
        getPersianDate();


      dateElement.textContent =
        toPersianDigits(
          date
        );

    }

    catch (error) {

      /*
       * Safe fallback
       */

      dateElement.textContent =
        "۱۷/۰۶/۱۴۰۵";

    }

  }


  /*
   * Immediately show date.
   */

  updateDate();


  /*
   * Check every minute.
   * If the website stays open
   * across midnight in Iran,
   * the date updates automatically.
   */

  setInterval(
    updateDate,
    60 * 1000
  );

})();

</script>
