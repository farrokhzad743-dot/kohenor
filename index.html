<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">

  <meta
    name="description"
    content="وبسایت شرکت تعاونی عشایری کوه نور به آدرس جدید منتقل شده است."
  >

  <title>شرکت تعاونی عشایری کوه نور</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --blue: #082d9c;
      --blue2: #164dcc;
      --blue3: #4779e8;

      --ink: #102044;
      --muted: #68758e;

      --white: #ffffff;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {
      position: relative;

      width: 100%;
      min-height: 100svh;

      overflow: hidden;

      font-family:
        "Vazirmatn",
        Tahoma,
        Arial,
        sans-serif;

      color: var(--ink);

      background:
        radial-gradient(
          ellipse at center,
          rgba(52, 92, 210, .065) 0%,
          rgba(52, 92, 210, .025) 25%,
          transparent 55%
        ),
        #ffffff;
    }


    /* =========================================================
       GALAXY CANVAS
    ========================================================= */

    #space {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================================================
       GALAXY LIGHT
    ========================================================= */

    .galaxy-light {
      position: fixed;

      left: 50%;
      top: 50%;

      width: 500px;
      height: 500px;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(50, 91, 210, .065) 0%,
          rgba(50, 91, 210, .025) 32%,
          transparent 70%
        );

      filter: blur(20px);

      z-index: 0;

      pointer-events: none;

      animation:
        galaxyBreath 7s ease-in-out infinite;
    }


    /* =========================================================
       MAIN CONTENT
    ========================================================= */

    .page {
      position: relative;

      z-index: 10;

      width:
        min(
          760px,
          calc(100% - 30px)
        );

      min-height: 100svh;

      margin: auto;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding:
        24px
        0
        calc(
          24px +
          env(safe-area-inset-bottom)
        );

      animation:
        pageEnter
        1.35s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    /* =========================================================
       COSMIC LOGO
    ========================================================= */

    .cosmic-logo {
      position: relative;

      width: 92px;
      height: 92px;

      margin-bottom: 30px;

      display: grid;

      place-items: center;

      animation:
        logoEnter
        1.4s
        .1s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    .logo-orbit {
      position: absolute;

      width: 84px;
      height: 84px;

      border-radius: 50%;

      border:
        1px solid rgba(8,45,156,.15);

      transform:
        rotate(20deg);

      animation:
        orbitRotate
        10s
        linear
        infinite;
    }


    .logo-orbit::before {
      content: "";

      position: absolute;

      width: 6px;
      height: 6px;

      top: -3px;
      left: 50%;

      margin-left: -3px;

      border-radius: 50%;

      background:
        var(--blue);

      box-shadow:
        0 0 12px
        rgba(8,45,156,.5);
    }


    .logo-orbit-two {
      position: absolute;

      width: 68px;
      height: 88px;

      border-radius: 50%;

      border:
        1px dashed rgba(8,45,156,.10);

      transform:
        rotate(-55deg);

      animation:
        orbitReverse
        13s
        linear
        infinite;
    }


    .logo-core {
      position: relative;

      width: 57px;
      height: 57px;

      display: grid;

      place-items: center;

      border-radius: 50%;

      border:
        1.5px solid
        rgba(8,45,156,.20);

      background:
        rgba(255,255,255,.82);

      box-shadow:
        0 15px 45px
        rgba(8,45,156,.10);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      animation:
        coreFloat
        4.5s
        ease-in-out
        infinite;
    }


    .core-symbol {
      width: 21px;
      height: 21px;

      border:
        2px solid
        var(--blue);

      border-left-color:
        transparent;

      border-radius: 50%;

      transform:
        rotate(-45deg);
    }


    .core-symbol::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      margin-top: 5px;
      margin-left: 5px;

      border-radius: 50%;

      background:
        var(--blue);

      box-shadow:
        0 0 15px
        rgba(8,45,156,.45);
    }


    /* =========================================================
       TEXT
    ========================================================= */

    h1 {
      max-width: 690px;

      font-size:
        clamp(
          25px,
          5.8vw,
          40px
        );

      line-height: 1.72;

      font-weight: 600;

      letter-spacing: -1px;

      opacity: 0;

      animation:
        textEnter
        .95s
        .38s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    .message {
      max-width: 590px;

      margin-top: 10px;
      margin-bottom: 28px;

      color:
        var(--muted);

      font-size:
        clamp(
          14px,
          2.8vw,
          17px
        );

      line-height: 2.15;

      opacity: 0;

      animation:
        textEnter
        .95s
        .55s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    /* =========================================================
       BUTTON
    ========================================================= */

    .button-wrap {
      position: relative;

      opacity: 0;

      animation:
        buttonEnter
        1s
        .72s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    .button-glow {
      position: absolute;

      inset: -12px;

      border-radius: 23px;

      background:
        rgba(8,45,156,.065);

      filter:
        blur(12px);

      animation:
        buttonGlow
        3.5s
        ease-in-out
        infinite;
    }


    .new-address {
      position: relative;

      z-index: 2;

      min-width: 190px;
      min-height: 56px;

      padding:
        0 29px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #082d9c,
          #174dca
        );

      color:
        #ffffff;

      text-decoration: none;

      font-size: 15px;

      font-weight: 600;

      box-shadow:
        0 16px 40px
        rgba(8,45,156,.21);

      overflow: hidden;

      transition:
        transform .28s ease,
        box-shadow .28s ease;
    }


    /* Moving shine */

    .new-address::before {
      content: "";

      position: absolute;

      top: 0;
      left: -110%;

      width: 65%;
      height: 100%;

      background:
        linear-gradient(
          100deg,
          transparent,
          rgba(255,255,255,.30),
          transparent
        );

      transform:
        skewX(-20deg);

      animation:
        shine
        4.5s
        ease-in-out
        infinite;
    }


    .button-text {
      position: relative;

      z-index: 2;
    }


    .new-address:hover {
      transform:
        translateY(-4px);

      box-shadow:
        0 22px 50px
        rgba(8,45,156,.28);
    }


    .new-address:active {
      transform:
        scale(.965);
    }


    /* =========================================================
       ADDRESS
    ========================================================= */

    .url {
      direction: ltr;

      margin-top: 15px;

      color:
        #8994ac;

      font-size: 12px;

      letter-spacing: .3px;

      opacity: 0;

      animation:
        fadeIn
        .8s
        1s
        ease
        forwards;
    }


    /* =========================================================
       DATE
    ========================================================= */

    .date-area {
      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      margin-top: 28px;

      opacity: 0;

      animation:
        dateEnter
        .9s
        1.12s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    .date-label {
      color:
        #a0a9bb;

      font-size: 10px;
    }


    .date-box {
      position: relative;

      min-width: 150px;

      height: 40px;

      padding:
        0 22px;

      display: flex;

      align-items: center;

      justify-content: center;

      direction: ltr;

      border-radius: 11px;

      border:
        1px solid
        rgba(8,45,156,.16);

      background:
        rgba(255,255,255,.82);

      color:
        #52617d;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: 1px;

      box-shadow:
        0 9px 28px
        rgba(8,45,156,.065);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);
    }


    /*
       Brackets
    */

    .date-box::before,
    .date-box::after {
      position: absolute;

      top: 50%;

      transform:
        translateY(-51%);

      color:
        rgba(8,45,156,.42);

      font-size: 18px;

      font-weight: 400;
    }


    .date-box::before {
      content: "[";

      left: 9px;
    }


    .date-box::after {
      content: "]";

      right: 9px;
    }


    /* =========================================================
       ANIMATIONS
    ========================================================= */

    @keyframes pageEnter {

      from {
        opacity: 0;

        transform:
          translateY(22px)
          scale(.985);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes logoEnter {

      from {
        opacity: 0;

        transform:
          scale(.45)
          rotate(-30deg);
      }

      to {
        opacity: 1;

        transform:
          scale(1)
          rotate(0);
      }
    }


    @keyframes coreFloat {

      0%,100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-5px);
      }
    }


    @keyframes orbitRotate {

      from {
        transform:
          rotate(20deg);
      }

      to {
        transform:
          rotate(380deg);
      }
    }


    @keyframes orbitReverse {

      from {
        transform:
          rotate(-55deg);
      }

      to {
        transform:
          rotate(-415deg);
      }
    }


    @keyframes textEnter {

      from {
        opacity: 0;

        transform:
          translateY(16px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes buttonEnter {

      from {
        opacity: 0;

        transform:
          translateY(20px)
          scale(.93);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes dateEnter {

      from {
        opacity: 0;

        transform:
          translateY(12px)
          scale(.96);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes buttonGlow {

      0%,100% {
        opacity: .3;

        transform:
          scale(.95);
      }

      50% {
        opacity: .75;

        transform:
          scale(1.06);
      }
    }


    @keyframes shine {

      0% {
        left: -110%;
      }

      35%,100% {
        left: 155%;
      }
    }


    @keyframes galaxyBreath {

      0%,100% {
        opacity: .55;

        transform:
          translate(-50%,-50%)
          scale(.92);
      }

      50% {
        opacity: 1;

        transform:
          translate(-50%,-50%)
          scale(1.08);
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 520px) {

      .page {
        width:
          calc(100% - 28px);

        padding:
          18px
          0
          calc(
            18px +
            env(safe-area-inset-bottom)
          );
      }


      .cosmic-logo {
        width: 86px;
        height: 86px;

        margin-bottom: 22px;
      }


      .logo-orbit {
        width: 78px;
        height: 78px;
      }


      .logo-orbit-two {
        width: 63px;
        height: 82px;
      }


      .logo-core {
        width: 54px;
        height: 54px;
      }


      h1 {
        max-width: 350px;

        font-size: 25px;

        line-height: 1.78;
      }


      .message {
        max-width: 345px;

        margin-top: 8px;
        margin-bottom: 23px;

        font-size: 14px;

        line-height: 2.08;
      }


      .new-address {
        width:
          min(
            330px,
            calc(100vw - 52px)
          );

        min-height: 55px;

        border-radius: 16px;
      }


      .url {
        margin-top: 14px;
      }


      .date-area {
        margin-top: 25px;
      }


      .date-box {
        min-width: 145px;
      }
    }


    /* =========================================================
       SHORT PHONES
    ========================================================= */

    @media (max-height: 680px) {

      .cosmic-logo {
        transform:
          scale(.82);

        margin-bottom: 5px;
      }


      h1 {
        font-size: 22px;
      }


      .message {
        margin-top: 6px;
        margin-bottom: 15px;

        font-size: 13px;
      }


      .date-area {
        margin-top: 18px;
      }
    }


    /* =========================================================
       ACCESSIBILITY
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;

        transition: none !important;
      }


      h1,
      .message,
      .button-wrap,
      .url,
      .date-area {
        opacity: 1 !important;
      }
    }

  </style>
</head>


<body>


  <!-- =======================================================
       GALAXY
  ======================================================== -->

  <canvas id="space"></canvas>

  <div class="galaxy-light"></div>


  <!-- =======================================================
       CONTENT
  ======================================================== -->

  <main class="page">


    <!-- Cosmic logo -->

    <div class="cosmic-logo">

      <div class="logo-orbit"></div>

      <div class="logo-orbit-two"></div>

      <div class="logo-core">

        <div class="core-symbol"></div>

      </div>

    </div>


    <!-- Main title -->

    <h1>
      وبسایت شرکت به آدرس زیر تغییر پیدا کرد.
    </h1>


    <!-- Description -->

    <p class="message">
      برای ورود به وبسایت جدید شرکت، روی دکمه زیر کلیک کنید.
    </p>


    <!-- Button -->

    <div class="button-wrap">

      <div class="button-glow"></div>

      <a
        class="new-address"
        href="https://taavonikohnoor.ir/"
        aria-label="ورود به وبسایت جدید شرکت"
      >

        <span class="button-text">
          کلیک کنید!
        </span>

      </a>

    </div>


    <!-- New domain -->

    <div class="url">
      taavonikohnoor.ir
    </div>


    <!-- Date -->

    <div class="date-area">

      <div class="date-label">
        تاریخ
      </div>

      <div
        class="date-box"
        id="persianDate"
      >
        ۱۷/۰۶/۱۴۰۵
      </div>

    </div>


  </main>


  <!-- =======================================================
       GALAXY ENGINE
  ======================================================== -->

  <script>

    (() => {

      const canvas =
        document.getElementById("space");

      const ctx =
        canvas.getContext("2d");


      let width = 0;
      let height = 0;
      let dpr = 1;

      let stars = [];

      let planets = [];

      let shootingStars = [];

      let lastTime = 0;


      /* =====================================================
         RESIZE
      ===================================================== */

      function resize() {

        width =
          window.innerWidth;

        height =
          window.innerHeight;

        dpr =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );


        canvas.width =
          width * dpr;

        canvas.height =
          height * dpr;

        canvas.style.width =
          width + "px";

        canvas.style.height =
          height + "px";


        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );


        createStars();

        createPlanets();

      }


      /* =====================================================
         STARS
      ===================================================== */

      function createStars() {

        stars = [];


        const mobile =
          width < 600;


        const count =
          mobile
            ? 210
            : 360;


        const cx =
          width / 2;

        const cy =
          height / 2;


        const maxRadius =
          Math.sqrt(
            width * width +
            height * height
          ) * .58;


        for (
          let i = 0;
          i < count;
          i++
        ) {

          const angle =
            Math.random() *
            Math.PI * 2;


          const radius =
            Math.pow(
              Math.random(),
              .55
            ) *
            maxRadius;


          /*
           * Spiral arms
           */

          const arm =
            Math.sin(
              radius * .018
            ) * .42;


          const finalAngle =
            angle + arm;


          stars.push({

            radius,

            angle:
              finalAngle,

            size:
              Math.random() *
              1.25 +
              .25,

            alpha:
              Math.random() *
              .38 +
              .06,

            speed:
              Math.random() *
              .00016 +
              .000035,

            phase:
              Math.random() *
              Math.PI * 2

          });

        }

      }


      /* =====================================================
         PLANETS
      ===================================================== */

      function createPlanets() {

        planets = [];


        /*
         * Saturn
         */

        planets.push({

          type:
            "saturn",

          angle:
            Math.random() *
            Math.PI * 2,

          radius:
            Math.min(
              width,
              height
            ) * .31,

          size:
            width < 600
              ? 16
              : 23,

          speed:
            .00011

        });


        /*
         * Jupiter
         */

        planets.push({

          type:
            "jupiter",

          angle:
            Math.PI +
            Math.random() * .8,

          radius:
            Math.min(
              width,
              height
            ) * .39,

          size:
            width < 600
              ? 13
              : 19,

          speed:
            -.000075

        });

      }


      /* =====================================================
         DRAW STAR
      ===================================================== */

      function drawStar(
        x,
        y,
        size,
        alpha,
        twinkle
      ) {

        const a =
          alpha * twinkle;


        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(27,72,175,${a})`;

        ctx.fill();


        /*
         * Bright star glow
         */

        if (
          size > 1.05
        ) {

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            size * 3.4,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            `rgba(55,105,220,${a * .07})`;

          ctx.fill();

        }

      }


      /* =====================================================
         DRAW JUPITER
      ===================================================== */

      function drawJupiter(
        x,
        y,
        size
      ) {

        ctx.save();


        /*
         * Glow
         */

        const glow =
          ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            size * 2.4
          );


        glow.addColorStop(
          0,
          "rgba(50,90,180,.13)"
        );

        glow.addColorStop(
          1,
          "rgba(50,90,180,0)"
        );


        ctx.fillStyle =
          glow;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size * 2.4,
          0,
          Math.PI * 2
        );

        ctx.fill();


        /*
         * Planet
         */

        const gradient =
          ctx.createRadialGradient(
            x - size * .35,
            y - size * .35,
            size * .1,
            x,
            y,
            size
          );


        gradient.addColorStop(
          0,
          "#f4f5f8"
        );

        gradient.addColorStop(
          .55,
          "#d9dee9"
        );

        gradient.addColorStop(
          1,
          "#aab4c7"
        );


        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          gradient;

        ctx.fill();


        /*
         * Jupiter atmosphere bands
         */

        ctx.save();

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size,
          0,
          Math.PI * 2
        );

        ctx.clip();


        for (
          let i = -4;
          i <= 4;
          i++
        ) {

          const yy =
            y +
            i *
            size *
            .21;


          ctx.fillStyle =
            i % 2 === 0
              ? "rgba(82,101,137,.16)"
              : "rgba(255,255,255,.24)";


          ctx.fillRect(
            x - size,
            yy,
            size * 2,
            size * .10
          );

        }


        /*
         * Great Red Spot
         */

        ctx.beginPath();

        ctx.ellipse(
          x + size * .28,
          y + size * .27,
          size * .25,
          size * .13,
          -.12,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "rgba(122,88,93,.20)";

        ctx.fill();


        ctx.restore();


        /*
         * Border
         */

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          "rgba(55,76,120,.16)";

        ctx.lineWidth = .7;

        ctx.stroke();


        ctx.restore();

      }


      /* =====================================================
         DRAW SATURN
      ===================================================== */

      function drawSaturn(
        x,
        y,
        size,
        rotation
      ) {

        ctx.save();


        /*
         * Glow
         */

        const glow =
          ctx.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            size * 2.8
          );


        glow.addColorStop(
          0,
          "rgba(50,90,190,.12)"
        );

        glow.addColorStop(
          1,
          "rgba(50,90,190,0)"
        );


        ctx.fillStyle =
          glow;

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size * 2.7,
          0,
          Math.PI * 2
        );

        ctx.fill();


        /*
         * Ring behind planet
         */

        ctx.translate(
          x,
          y
        );


        ctx.rotate(
          rotation
        );


        ctx.scale(
          1,
          .34
        );


        ctx.beginPath();

        ctx.ellipse(
          0,
          0,
          size * 1.9,
          size * .72,
          0,
          0,
          Math.PI * 2
        );


        ctx.strokeStyle =
          "rgba(92,118,175,.20)";

        ctx.lineWidth =
          size * .17;

        ctx.stroke();


        ctx.beginPath();

        ctx.ellipse(
          0,
          0,
          size * 1.65,
          size * .60,
          0,
          0,
          Math.PI * 2
        );


        ctx.strokeStyle =
          "rgba(38,72,150,.12)";

        ctx.lineWidth =
          size * .055;

        ctx.stroke();


        /*
         * Planet
         */

        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );


        const gradient =
          ctx.createRadialGradient(
            x - size * .35,
            y - size * .38,
            size * .1,
            x,
            y,
            size
          );


        gradient.addColorStop(
          0,
          "#f5f7fb"
        );

        gradient.addColorStop(
          .55,
          "#dce2ec"
        );

        gradient.addColorStop(
          1,
          "#aeb9cc"
        );


        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          gradient;

        ctx.fill();


        /*
         * Front ring
         */

        ctx.save();

        ctx.translate(
          x,
          y
        );

        ctx.rotate(
          rotation
        );

        ctx.scale(
          1,
          .34
        );


        ctx.beginPath();

        ctx.ellipse(
          0,
          0,
          size * 1.9,
          size * .72,
          0,
          0,
          Math.PI
        );


        ctx.strokeStyle =
          "rgba(74,99,157,.25)";

        ctx.lineWidth =
          size * .11;

        ctx.stroke();


        ctx.restore();


        /*
         * Planet border
         */

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          size,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          "rgba(55,76,120,.14)";

        ctx.lineWidth = .7;

        ctx.stroke();


        ctx.restore();

      }


      /* =====================================================
         DRAW GALAXY
      ===================================================== */

      function draw(time) {

        ctx.clearRect(
          0,
          0,
          width,
          height
        );


        const cx =
          width / 2;

        const cy =
          height / 2;


        /*
         * Milky Way disk
         */

        ctx.save();

        ctx.translate(
          cx,
          cy
        );

        ctx.rotate(
          -0.18
        );

        ctx.scale(
          1,
          .34
        );


        const galaxy =
          ctx.createRadialGradient(
            0,
            0,
            0,
            0,
            0,
            Math.min(width,height) * .60
          );


        galaxy.addColorStop(
          0,
          "rgba(42,82,185,.11)"
        );

        galaxy.addColorStop(
          .16,
          "rgba(42,82,185,.06)"
        );

        galaxy.addColorStop(
          .42,
          "rgba(65,105,215,.025)"
        );

        galaxy.addColorStop(
          1,
          "rgba(255,255,255,0)"
        );


        ctx.fillStyle =
          galaxy;


        ctx.beginPath();

        ctx.arc(
          0,
          0,
          Math.min(width,height) * .60,
          0,
          Math.PI * 2
        );

        ctx.fill();


        ctx.restore();


        /* ---------------------------------------------------
           Stars
        --------------------------------------------------- */

        for (
          const star of stars
        ) {

          const angle =
            star.angle +
            time * star.speed;


          const x =
            cx +
            Math.cos(angle) *
            star.radius;


          const y =
            cy +
            Math.sin(angle) *
            star.radius *
            .34;


          const twinkle =
            .65 +
            Math.sin(
              time * .0017 +
              star.phase
            ) * .35;


          drawStar(
            x,
            y,
            star.size,
            star.alpha,
            twinkle
          );

        }


        /* ---------------------------------------------------
           Galaxy core
        --------------------------------------------------- */

        const core =
          ctx.createRadialGradient(
            cx,
            cy,
            0,
            cx,
            cy,
            Math.min(width,height) * .22
          );


        core.addColorStop(
          0,
          "rgba(35,75,175,.10)"
        );

        core.addColorStop(
          .28,
          "rgba(45,90,200,.045)"
        );

        core.addColorStop(
          1,
          "rgba(255,255,255,0)"
        );


        ctx.fillStyle =
          core;


        ctx.beginPath();

        ctx.arc(
          cx,
          cy,
          Math.min(width,height) * .22,
          0,
          Math.PI * 2
        );

        ctx.fill();


        /* ---------------------------------------------------
           Planets
        --------------------------------------------------- */

        planets.forEach(
          (planet, index) => {

            const angle =
              planet.angle +
              time *
              planet.speed;


            const x =
              cx +
              Math.cos(angle) *
              planet.radius;


            const y =
              cy +
              Math.sin(angle) *
              planet.radius *
              .38;


            if (
              planet.type ===
              "saturn"
            ) {

              drawSaturn(
                x,
                y,
                planet.size,
                angle * .35
              );

            }


            if (
              planet.type ===
              "jupiter"
            ) {

              drawJupiter(
                x,
                y,
                planet.size
              );

            }

          }
        );


        /* ---------------------------------------------------
           Shooting stars
        --------------------------------------------------- */

        if (
          Math.random() < .0028
        ) {

          shootingStars.push({

            x:
              Math.random() *
              width,

            y:
              Math.random() *
              height *
              .30,

            length:
              35 +
              Math.random() *
              55,

            speed:
              2.5 +
              Math.random() *
              3,

            life:
              1

          });

        }


        shootingStars =
          shootingStars.filter(
            star =>
              star.life > 0
        );


        shootingStars.forEach(
          star => {

            star.x +=
              star.speed;

            star.y +=
              star.speed * .38;

            star.life -=
              .018;


            const trail =
              ctx.createLinearGradient(
                star.x,
                star.y,
                star.x - star.length,
                star.y - star.length * .38
              );


            trail.addColorStop(
              0,
              `rgba(45,95,210,${star.life * .30})`
            );

            trail.addColorStop(
              1,
              "rgba(45,95,210,0)"
            );


            ctx.beginPath();

            ctx.moveTo(
              star.x,
              star.y
            );

            ctx.lineTo(
              star.x - star.length,
              star.y - star.length * .38
            );

            ctx.strokeStyle =
              trail;

            ctx.lineWidth = 1;

            ctx.stroke();

          }
        );


        lastTime =
          time;


        requestAnimationFrame(
          draw
        );

      }


      window.addEventListener(
        "resize",
        resize,
        {
          passive: true
        }
      );


      resize();


      requestAnimationFrame(
        draw
      );

    })();


    /* =========================================================
       AUTOMATIC IRANIAN PERSIAN DATE
    ========================================================= */

    (() => {

      const dateElement =
        document.getElementById(
          "persianDate"
        );


      /*
       * Persian digits
       */

      function persianDigits(
        value
      ) {

        return String(value)
          .replace(
            /\d/g,
            d =>
              "۰۱۲۳۴۵۶۷۸۹"[d]
          );

      }


      /*
       * Get the current Persian
       * calendar date using Iran time.
       *
       * IMPORTANT:
       * en-US is deliberately used here so
       * the browser returns ASCII numbers.
       * This avoids the bug caused by parseInt
       * on Persian/Arabic digits.
       */

      function getIranianDate() {

        const now =
          new Date();


        const formatter =
          new Intl.DateTimeFormat(
            "en-US-u-ca-persian",
            {
              timeZone:
                "Asia/Tehran",

              year:
                "numeric",

              month:
                "2-digit",

              day:
                "2-digit"
            }
          );


        const parts =
          formatter.formatToParts(
            now
          );


        let year = "";
        let month = "";
        let day = "";


        parts.forEach(
          part => {

            if (
              part.type ===
              "year"
            ) {
              year =
                part.value;
            }


            if (
              part.type ===
              "month"
            ) {
              month =
                part.value;
            }


            if (
              part.type ===
              "day"
            ) {
              day =
                part.value;
            }

          }
        );


        /*
         * Force two-digit day/month
         */

        day =
          day.padStart(
            2,
            "0"
          );


        month =
          month.padStart(
            2,
            "0"
          );


        year =
          year.padStart(
            4,
            "0"
          );


        return (
          day +
          "/" +
          month +
          "/" +
          year
        );

      }


      function updateDate() {

        try {

          const date =
            getIranianDate();


          dateElement.textContent =
            persianDigits(
              date
            );

        }

        catch (error) {

          /*
           * Fallback so the box
           * never remains empty.
           */

          dateElement.textContent =
            "۱۷/۰۶/۱۴۰۵";

        }

      }


      /*
       * Initial update
       */

      updateDate();


      /*
       * Check every minute.
       *
       * If the page stays open across
       * midnight in Iran, the date
       * automatically changes.
       */

      setInterval(
        updateDate,
        60 * 1000
      );

    })();

  </script>
