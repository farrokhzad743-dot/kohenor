<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">

  <meta
    name="description"
    content="وبسایت شرکت تعاونی عشایری کوه نور به آدرس جدید منتقل شده است."
  >

  <title>شرکت تعاونی عشایری کوه نور</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       ROOT
    ===================================================== */

    :root {
      --blue: #082d9c;
      --blue2: #164dcc;
      --blue3: #5f8cff;

      --ink: #102044;
      --muted: #68758f;

      --white: #ffffff;
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      width: 100%;
      min-height: 100%;
    }


    body {
      min-height: 100svh;

      overflow: hidden;

      position: relative;

      font-family:
        "Vazirmatn",
        Tahoma,
        Arial,
        sans-serif;

      color: var(--ink);

      background:
        radial-gradient(
          ellipse at center,
          rgba(76, 120, 255, .075) 0%,
          rgba(76, 120, 255, .035) 23%,
          rgba(255,255,255,0) 55%
        ),
        #ffffff;
    }


    /* =====================================================
       GALAXY CANVAS
    ===================================================== */

    #galaxy {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 1;

      pointer-events: none;
    }


    /* =====================================================
       LIGHT ATMOSPHERE
    ===================================================== */

    .light {
      position: fixed;

      z-index: 0;

      width: 65vw;
      height: 65vw;

      max-width: 650px;
      max-height: 650px;

      border-radius: 50%;

      pointer-events: none;

      filter: blur(70px);

      opacity: .45;
    }


    .light.one {
      top: -38%;
      right: -25%;

      background:
        rgba(50, 100, 230, .07);

      animation:
        lightMoveOne 13s ease-in-out infinite;
    }


    .light.two {
      bottom: -40%;
      left: -27%;

      background:
        rgba(60, 115, 255, .055);

      animation:
        lightMoveTwo 16s ease-in-out infinite;
    }


    /* =====================================================
       CENTER GALAXY CORE
    ===================================================== */

    .galaxy-core {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 1px;
      height: 1px;

      transform:
        translate(-50%, -50%);

      z-index: 2;

      pointer-events: none;
    }


    .core-glow {
      position: absolute;

      width: 180px;
      height: 180px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(39, 83, 210, .09) 0%,
          rgba(39, 83, 210, .045) 28%,
          rgba(39, 83, 210, 0) 70%
        );

      filter: blur(4px);

      animation:
        coreBreath 5s ease-in-out infinite;
    }


    .core-ring {
      position: absolute;

      width: 95px;
      height: 95px;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      border-radius: 50%;

      border:
        1px solid rgba(8,45,156,.10);

      animation:
        coreRing 7s linear infinite;
    }


    .core-ring::before {
      content: "";

      position: absolute;

      inset: -18px;

      border-radius: 50%;

      border:
        1px solid rgba(8,45,156,.055);

      animation:
        coreRingReverse 11s linear infinite;
    }


    /* =====================================================
       MAIN CONTENT
    ===================================================== */

    .page {
      position: relative;

      z-index: 10;

      min-height: 100svh;

      width:
        min(
          760px,
          calc(100% - 32px)
        );

      margin: 0 auto;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        25px
        0
        calc(25px + env(safe-area-inset-bottom));

      animation:
        pageIn 1.4s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    /* =====================================================
       BRAND ORBIT
    ===================================================== */

    .brand-mark {
      position: relative;

      width: 92px;
      height: 92px;

      margin-bottom: 32px;

      display: grid;

      place-items: center;

      animation:
        markIn 1.4s
        .1s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    .brand-mark::before {
      content: "";

      position: absolute;

      inset: 8px;

      border-radius: 50%;

      border:
        1px solid rgba(8,45,156,.13);

      animation:
        orbitOne 9s linear infinite;
    }


    .brand-mark::after {
      content: "";

      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:
        1px dashed rgba(8,45,156,.10);

      animation:
        orbitTwo 15s linear infinite;
    }


    .brand-center {
      position: relative;

      width: 58px;
      height: 58px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.85);

      border:
        1.5px solid rgba(8,45,156,.20);

      box-shadow:
        0 12px 35px rgba(8,45,156,.10),
        inset 0 0 20px rgba(8,45,156,.035);

      display: grid;

      place-items: center;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      animation:
        centerFloat 5s ease-in-out infinite;
    }


    .brand-center::before {
      content: "";

      position: absolute;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      border:
        2px solid var(--blue);

      border-left-color:
        transparent;

      transform:
        rotate(-45deg);

      animation:
        symbolSpin 5s ease-in-out infinite;
    }


    .brand-center::after {
      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--blue);

      box-shadow:
        0 0 15px
        rgba(8,45,156,.40);
    }


    /* =====================================================
       HEADING
    ===================================================== */

    h1 {
      max-width: 680px;

      font-size:
        clamp(
          25px,
          5.5vw,
          40px
        );

      line-height: 1.75;

      font-weight: 600;

      letter-spacing: -1px;

      opacity: 0;

      animation:
        reveal
        1s
        .35s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    .message {
      max-width: 580px;

      margin-top: 10px;
      margin-bottom: 28px;

      color:
        var(--muted);

      font-size:
        clamp(
          14px,
          2.7vw,
          17px
        );

      line-height: 2.15;

      opacity: 0;

      animation:
        reveal
        1s
        .52s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    /* =====================================================
       BUTTON
    ===================================================== */

    .button-container {
      position: relative;

      opacity: 0;

      animation:
        buttonEnter
        1s
        .72s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    .button-glow {
      position: absolute;

      inset: -10px;

      border-radius: 22px;

      background:
        rgba(8,45,156,.055);

      filter: blur(12px);

      animation:
        buttonGlow 3.5s ease-in-out infinite;
    }


    .new-address {
      position: relative;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      min-width: 190px;

      min-height: 56px;

      padding:
        0 28px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          #082d9c 0%,
          #164dcc 100%
        );

      color:
        #ffffff;

      text-decoration: none;

      font-size: 15px;

      font-weight: 600;

      box-shadow:
        0 14px 38px
        rgba(8,45,156,.19);

      overflow: hidden;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }


    /* moving light */

    .new-address::before {
      content: "";

      position: absolute;

      top: 0;

      left: -100%;

      width: 65%;

      height: 100%;

      background:
        linear-gradient(
          100deg,
          transparent,
          rgba(255,255,255,.30),
          transparent
        );

      transform:
        skewX(-20deg);

      animation:
        shine 4.5s ease-in-out infinite;
    }


    .button-text,
    .arrow {
      position: relative;

      z-index: 2;
    }


    .arrow {
      font-size: 19px;

      transition:
        transform .3s ease;
    }


    .new-address:hover {
      transform:
        translateY(-4px);

      box-shadow:
        0 20px 48px
        rgba(8,45,156,.27);
    }


    .new-address:hover .arrow {
      transform:
        translateX(-6px);
    }


    .new-address:active {
      transform:
        scale(.965);
    }


    /* =====================================================
       ADDRESS
    ===================================================== */

    .url {
      direction: ltr;

      margin-top: 16px;

      color:
        #8994ac;

      font-size: 12px;

      letter-spacing: .3px;

      opacity: 0;

      animation:
        fadeIn
        .8s
        1s
        ease
        forwards;
    }


    /* =====================================================
       DATE BOX
    ===================================================== */

    .date-area {
      margin-top: 30px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 9px;

      opacity: 0;

      animation:
        dateEnter
        1s
        1.1s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }


    .date-label {
      color:
        #9aa4b8;

      font-size: 10px;

      font-weight: 400;
    }


    .date-box {
      position: relative;

      min-width: 142px;

      height: 39px;

      padding:
        0 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      direction: ltr;

      border-radius: 11px;

      border:
        1px solid rgba(8,45,156,.15);

      background:
        rgba(255,255,255,.78);

      color:
        #4c5b78;

      font-size: 13px;

      font-weight: 500;

      letter-spacing: .8px;

      box-shadow:
        0 7px 25px
        rgba(8,45,156,.055);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition:
        border-color .3s ease,
        box-shadow .3s ease;
    }


    /* the bracket effect */

    .date-box::before,
    .date-box::after {
      position: absolute;

      color:
        rgba(8,45,156,.42);

      font-size: 17px;

      font-weight: 400;

      top: 50%;

      transform:
        translateY(-51%);
    }


    .date-box::before {
      content: "[";

      left: 8px;
    }


    .date-box::after {
      content: "]";

      right: 8px;
    }


    .date-box:hover {
      border-color:
        rgba(8,45,156,.25);

      box-shadow:
        0 10px 30px
        rgba(8,45,156,.09);
    }


    /* =====================================================
       ANIMATIONS
    ===================================================== */

    @keyframes pageIn {

      from {
        opacity: 0;

        transform:
          translateY(22px)
          scale(.985);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes markIn {

      from {
        opacity: 0;

        transform:
          scale(.45)
          rotate(-35deg);
      }

      to {
        opacity: 1;

        transform:
          scale(1)
          rotate(0);
      }
    }


    @keyframes centerFloat {

      0%,100% {
        transform:
          translateY(0);
      }

      50% {
        transform:
          translateY(-5px);
      }
    }


    @keyframes orbitOne {

      to {
        transform:
          rotate(360deg);
      }
    }


    @keyframes orbitTwo {

      to {
        transform:
          rotate(-360deg);
      }
    }


    @keyframes symbolSpin {

      0%,100% {
        transform:
          rotate(-45deg);
      }

      50% {
        transform:
          rotate(15deg);
      }
    }


    @keyframes reveal {

      from {
        opacity: 0;

        transform:
          translateY(17px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }
    }


    @keyframes buttonEnter {

      from {
        opacity: 0;

        transform:
          translateY(20px)
          scale(.93);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes dateEnter {

      from {
        opacity: 0;

        transform:
          translateY(12px)
          scale(.96);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes fadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    @keyframes buttonGlow {

      0%,100% {
        opacity: .35;

        transform:
          scale(.94);
      }

      50% {
        opacity: .8;

        transform:
          scale(1.05);
      }
    }


    @keyframes shine {

      0% {
        left: -100%;
      }

      32%,
      100% {
        left: 150%;
      }
    }


    @keyframes coreBreath {

      0%,100% {
        transform:
          translate(-50%,-50%)
          scale(.8);

        opacity: .45;
      }

      50% {
        transform:
          translate(-50%,-50%)
          scale(1.18);

        opacity: .9;
      }
    }


    @keyframes coreRing {

      0% {
        transform:
          translate(-50%,-50%)
          rotate(0deg);
      }

      100% {
        transform:
          translate(-50%,-50%)
          rotate(360deg);
      }
    }


    @keyframes coreRingReverse {

      0% {
        transform:
          rotate(0deg);
      }

      100% {
        transform:
          rotate(-360deg);
      }
    }


    @keyframes lightMoveOne {

      0%,100% {
        transform:
          translate(0,0)
          scale(1);
      }

      50% {
        transform:
          translate(-30px,25px)
          scale(1.1);
      }
    }


    @keyframes lightMoveTwo {

      0%,100% {
        transform:
          translate(0,0)
          scale(1);
      }

      50% {
        transform:
          translate(25px,-25px)
          scale(1.08);
      }
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 520px) {

      .page {
        width:
          calc(100% - 28px);

        padding:
          20px
          0
          calc(
            20px +
            env(safe-area-inset-bottom)
          );
      }


      .brand-mark {
        width: 88px;
        height: 88px;

        margin-bottom: 23px;
      }


      .brand-center {
        width: 54px;
        height: 54px;
      }


      .brand-mark::before {
        inset: 7px;
      }


      h1 {
        max-width: 350px;

        font-size: 25px;

        line-height: 1.78;

        letter-spacing: -.7px;
      }


      .message {
        max-width: 345px;

        margin-top: 9px;
        margin-bottom: 23px;

        font-size: 14px;

        line-height: 2.1;
      }


      .new-address {
        width:
          min(
            330px,
            calc(100vw - 52px)
          );

        min-height: 55px;

        border-radius: 16px;
      }


      .url {
        margin-top: 14px;
      }


      .date-area {
        margin-top: 25px;
      }


      .date-box {
        min-width: 140px;
      }
    }


    /* =====================================================
       SMALL HEIGHT DEVICES
    ===================================================== */

    @media (max-height: 650px) {

      .brand-mark {
        transform:
          scale(.78);

        margin-bottom: 3px;
      }


      h1 {
        font-size: 22px;
      }


      .message {
        margin-top: 6px;
        margin-bottom: 14px;

        font-size: 13px;
      }


      .date-area {
        margin-top: 17px;
      }
    }


    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;

        transition: none !important;
      }


      h1,
      .message,
      .button-container,
      .url,
      .date-area {
        opacity: 1 !important;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================================
       GALAXY
  ===================================================== -->

  <canvas id="galaxy"></canvas>


  <!-- Ambient light -->
  <div class="light one"></div>
  <div class="light two"></div>


  <!-- =====================================================
       PAGE
  ===================================================== -->

  <main class="page">


    <!-- Animated brand mark -->
    <div class="brand-mark">

      <div class="brand-center"></div>

    </div>


    <!-- Main message -->
    <h1>
      وبسایت شرکت به آدرس زیر تغییر پیدا کرد.
    </h1>


    <p class="message">
      برای ورود به وبسایت جدید شرکت، روی دکمه زیر کلیک کنید.
    </p>


    <!-- Button -->
    <div class="button-container">

      <div class="button-glow"></div>

      <a
        class="new-address"
        href="https://taavonikohnoor.ir/"
        aria-label="ورود به وبسایت جدید شرکت"
      >

        <span class="button-text">
          کلیک کنید!
        </span>

        <span class="arrow">
          ←
        </span>

      </a>

    </div>


    <!-- Address -->
    <div class="url">
      taavonikohnoor.ir
    </div>


    <!-- =====================================================
         AUTOMATIC DATE
    ===================================================== -->

    <div class="date-area">

      <div class="date-label">
        تاریخ
      </div>

      <div
        class="date-box"
        id="persianDate"
        aria-label="تاریخ امروز"
      >
        ۰۰/۰۰/۰۰۰۰
      </div>

    </div>


  </main>


  <!-- =====================================================
       GALAXY ENGINE
  ===================================================== -->

  <script>

    (() => {

      const canvas =
        document.getElementById("galaxy");

      const ctx =
        canvas.getContext("2d", {
          alpha: true
        });


      let width;
      let height;
      let dpr;

      let stars = [];
      let shootingStars = [];

      let animationFrame;


      /* -----------------------------------------------------
         Resize
      ----------------------------------------------------- */

      function resize() {

        dpr =
          Math.min(
            window.devicePixelRatio || 1,
            2
          );

        width =
          window.innerWidth;

        height =
          window.innerHeight;


        canvas.width =
          width * dpr;

        canvas.height =
          height * dpr;

        canvas.style.width =
          width + "px";

        canvas.style.height =
          height + "px";


        ctx.setTransform(
          dpr,
          0,
          0,
          dpr,
          0,
          0
        );


        createGalaxy();

      }


      /* -----------------------------------------------------
         Create stars
      ----------------------------------------------------- */

      function createGalaxy() {

        stars = [];


        const mobile =
          width < 600;


        const count =
          mobile
            ? 150
            : 250;


        const centerX =
          width / 2;

        const centerY =
          height / 2;


        const maxRadius =
          Math.sqrt(
            width * width +
            height * height
          ) * .46;


        for (
          let i = 0;
          i < count;
          i++
        ) {

          const angle =
            Math.random() *
            Math.PI * 2;


          const radius =
            Math.pow(
              Math.random(),
              .62
            ) *
            maxRadius;


          /*
           * Spiral distribution.
           * This creates the galaxy structure
           * instead of random stars.
           */

          const spiral =
            angle +
            radius * .004;


          const x =
            centerX +
            Math.cos(spiral) *
            radius;

          const y =
            centerY +
            Math.sin(spiral
