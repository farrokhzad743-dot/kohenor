<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082d9c">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="وبسایت شرکت تعاونی عشایری کوه نور به آدرس جدید منتقل شده است.">
  <title>شرکت تعاونی عشایری کوه نور</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #082d9c;
      --blue-dark: #061d63;
      --ink: #102044;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 45%, rgba(8,45,156,.055), transparent 34%),
        #fff;
      color: var(--ink);
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    .page {
      width: min(720px, calc(100% - 36px));
      text-align: center;
      animation: pageIn .9s cubic-bezier(.22,1,.36,1) both;
    }

    .mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 34px;
      position: relative;
      display: grid;
      place-items: center;
      border: 1.5px solid rgba(8,45,156,.22);
      border-radius: 50%;
      animation: float 4s ease-in-out infinite;
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid var(--blue);
    }

    .mark::before {
      width: 20px;
      height: 20px;
      border-left-color: transparent;
      transform: rotate(-45deg);
    }

    .mark::after {
      width: 8px;
      height: 8px;
      background: var(--blue);
      border: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 40px);
      font-weight: 600;
      letter-spacing: -1px;
      line-height: 1.7;
    }

    .message {
      margin: 16px auto 30px;
      font-size: clamp(15px, 2.7vw, 18px);
      line-height: 2.2;
      color: #66708a;
    }

    .new-address {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 24px;
      border-radius: 15px;
      background: var(--blue);
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(8,45,156,.18);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .new-address:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 38px rgba(8,45,156,.24);
    }

    .arrow {
      display: inline-block;
      transition: transform .25s ease;
    }

    .new-address:hover .arrow {
      transform: translateX(-4px);
    }

    .url {
      margin-top: 18px;
      font-size: 12px;
      color: #8994ac;
      direction: ltr;
      letter-spacing: .2px;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 520px) {
      .page { width: min(100% - 28px, 720px); }
      .mark { margin-bottom: 26px; }
      .message { margin-top: 12px; margin-bottom: 24px; }
      .new-address { width: 100%; justify-content: center; }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="mark" aria-hidden="true"></div>

    <h1>وبسایت شرکت به آدرس زیر تغییر پیدا کرد.</h1>

    <p class="message">
      برای ورود به وبسایت جدید شرکت، روی دکمه زیر کلیک کنید.
    </p>

    <a
      class="new-address"
      href="https://taavonikohnoor.ir/"
      aria-label="ورود به وبسایت جدید شرکت"
    >
      کلیک کنید!
      <span class="arrow" aria-hidden="true">←</span>
    </a>

    <div class="url">taavonikohnoor.ir</div>
  </main>
</body>
</html>
