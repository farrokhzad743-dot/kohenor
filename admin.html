<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت پایگاه داده | کوه نور</title><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
body{font-family:Vazirmatn,sans-serif}.admin-wrap{max-width:1100px;margin:auto;padding:20px 14px 70px}.card{background:#fff;border:1px solid #e2e7f0;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 10px 30px rgba(20,50,100,.07)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:7px}.field label{font-weight:800}.field input,.field textarea,.field select{font:inherit;padding:12px;border:1px solid #d7dfeb;border-radius:14px}.field textarea{min-height:130px;line-height:1.9}.btn{border:0;border-radius:13px;padding:12px 17px;font:inherit;font-weight:800;cursor:pointer}.blue{background:#1645b5;color:#fff}.light{background:#edf2ff;color:#1645b5}.red{background:#d92d3a;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:25px;margin-top:10px;font-weight:700}.ok{color:#087443}.error{color:#b42318}.item{border:1px solid #e1e7f0;border-radius:18px;padding:14px;margin:12px 0;background:#fbfcff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.thumb{width:130px;height:90px;object-fit:cover;border-radius:12px}.sticky{position:sticky;bottom:10px}.preview{width:100%;height:500px;border:1px solid #ddd;border-radius:16px}.login{max-width:470px;margin:70px auto}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<section id="loginCard" class="admin-wrap"><div class="card login"><h1>ورود مالک</h1><p>ورود مدیریت فقط برای ایمیل مالک مجاز است.</p><div class="field"><label>ایمیل</label><input id="email" type="email" value="farrokhzad743@gmail.com"></div><div class="row" style="margin-top:12px"><button id="sendLogin" class="btn blue">ارسال کد ورود</button><button id="changeEmail" class="btn light hidden">تغییر ایمیل</button></div><div id="otpBox" class="hidden" style="margin-top:12px"><div class="field"><label>کد ورود</label><input id="otpCode" inputmode="numeric" maxlength="8"></div><button id="verifyLogin" class="btn blue" style="margin-top:10px;width:100%">ورود به پنل مدیریت</button></div><div id="loginStatus" class="status"></div></div></section>
<main id="panel" class="hidden"><div class="admin-wrap"><div class="row" style="justify-content:space-between;align-items:center"><div><h1>مدیریت پایگاه داده کوه نور</h1><div id="who"></div></div><div class="row"><button id="previewSite" class="btn light">مشاهده سایت</button><button id="logout" class="btn red">خروج</button></div></div>
<section class="card"><h2>هدر سایت</h2><div class="grid"><div class="field"><label>عنوان</label><input id="siteTitle"></div><div class="field"><label>تاریخ</label><input id="siteDate" readonly></div><div class="field"><label>لوگوی راست</label><input id="logoRight"></div><div class="field"><label>لوگوی چپ</label><input id="logoLeft"></div></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><h2>اخبار</h2><button id="addNews" class="btn blue">＋ خبر جدید</button></div><div id="newsAdminList"></div><div id="newsEditor" class="hidden"><hr><div class="grid"><div class="field"><label>عنوان</label><input id="newsTitle"></div><div class="field"><label>تاریخ</label><input id="newsDate" readonly></div><div class="field full"><label>خلاصه</label><textarea id="newsExcerpt"></textarea></div><div class="field full"><label>متن کامل</label><textarea id="newsBody"></textarea></div><div class="field full"><label>انتخاب چند تصویر از گالری</label><input id="newsImages" type="file" accept="image/*" multiple><small id="selectedFiles"></small></div></div><div class="row" style="margin-top:12px"><button id="saveNews" class="btn blue">ذخیره خبر</button><button id="cancelNews" class="btn light">انصراف</button></div></div></section>
<section class="card"><div class="row" style="justify-content:space-between"><h2>اسناد و مدارک</h2><button id="addDoc" class="btn blue">＋ سند جدید</button></div><div id="docsList"></div><div id="docEditor" class="hidden"><hr><div class="grid"><div class="field"><label>عنوان سند</label><input id="docTitle"></div><div class="field full"><label>فایل سند</label><input id="docFile" type="file" accept="application/pdf,image/*"><small id="docCurrent"></small></div></div><div class="row" style="margin-top:12px"><button id="saveDoc" class="btn blue">ذخیره سند</button><button id="cancelDoc" class="btn light">انصراف</button></div></div></section>
<section class="card"><h2>دکمه‌های صفحه اصلی</h2><div id="buttonsList"></div><button id="addButton" class="btn blue">＋ افزودن دکمه</button><div id="buttonEditor" class="hidden"><hr><div class="grid"><div class="field"><label>متن دکمه</label><input id="buttonLabel"></div><div class="field"><label>مقصد</label><input id="buttonTarget"></div></div><div class="row" style="margin-top:12px"><button id="saveButton" class="btn blue">ذخیره</button><button id="cancelButton" class="btn light">انصراف</button></div></div></section>
<section class="card"><h2>عشایر؛ سرمایه ملّی</h2><div class="grid"><div class="field"><label>عنوان</label><input id="ashTitle"></div><div class="field"><label>خلاصه</label><textarea id="ashExcerpt"></textarea></div><div class="field full"><label>متن کامل</label><textarea id="ashBody"></textarea></div></div></section>
<section class="card"><h2>چگونگی تعاونی</h2><div class="grid"><div class="field"><label>عنوان</label><input id="coopTitle"></div><div class="field"><label>خلاصه</label><textarea id="coopExcerpt"></textarea></div><div class="field full"><label>متن کامل</label><textarea id="coopBody"></textarea></div></div></section>
<section class="card"><h2>درباره ما</h2><div class="grid"><div class="field"><label>عنوان</label><input id="aboutTitle"></div><div class="field full"><label>متن</label><textarea id="aboutBody"></textarea></div></div></section>
<div class="sticky"><button id="saveAll" class="btn blue" style="width:100%;font-size:18px">✓ ذخیره تنظیمات</button><div id="adminStatus" class="status"></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
