<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>مدیریت پایگاه داده | کوه نور</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body.admin-page {
      background: #f7f8fa;
    }

    .admin-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }

    .admin-top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
    }

    .admin-title h1 {
      margin: 0 0 6px;
    }

    .admin-title p {
      margin: 0;
      opacity: .7;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .admin-card {
      background: #fff;
      border: 1px solid #e7e9ed;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.04);
    }

    .admin-card.full {
      grid-column: 1 / -1;
    }

    .admin-card h2 {
      margin-top: 0;
    }

    .field {
      margin: 12px 0;
    }

    .field label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d9dde3;
      border-radius: 10px;
      padding: 11px;
      font: inherit;
      background: #fff;
    }

    .field textarea {
      min-height: 130px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
    }

    .admin-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font: inherit;
      cursor: pointer;
      background: #17202a;
      color: #fff;
    }

    .admin-btn.secondary {
      background: #eef1f4;
      color: #20252b;
    }

    .admin-btn.danger {
      background: #b42318;
    }

    .status {
      margin-top: 10px;
      min-height: 24px;
    }

    .status.ok {
      color: #087443;
    }

    .status.error {
      color: #b42318;
    }

    .hidden {
      display: none !important;
    }

    .list-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .list-item small {
      display: block;
      opacity: .65;
      margin-top: 4px;
    }

    .thumb {
      width: 70px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    .login-card {
      max-width: 460px;
      margin: 70px auto;
    }

    .preview-frame {
      width: 100%;
      min-height: 480px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #fff;
    }

    @media (max-width: 800px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }

      .admin-card.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body class="admin-page">

  <!-- =========================
       LOGIN
  ========================== -->

  <div id="loginCard" class="admin-card login-card">

    <h1>ورود مالک</h1>

    <p>
      ورود فقط برای ایمیل مالک مجاز است.
      یک کد یک‌بارمصرف به ایمیل شما ارسال می‌شود.
    </p>

    <div class="field">
      <label>ایمیل مالک</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="ایمیل مالک"
      >
    </div>

    <div id="otpBox" class="hidden">

      <div class="field">
        <label>کد ورود</label>

        <input
          id="otpCode"
          inputmode="numeric"
          maxlength="8"
          autocomplete="one-time-code"
          placeholder="کد ورود"
        >
      </div>

      <div class="row">

        <button
          id="verifyLogin"
          class="admin-btn"
          type="button"
        >
          ورود به پنل مدیریت
        </button>

        <button
          id="changeEmail"
          class="admin-btn secondary"
          type="button"
        >
          تغییر ایمیل
        </button>

      </div>

    </div>

    <button
      id="sendLogin"
      class="admin-btn"
      type="button"
    >
      ارسال کد ورود
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- =========================
       ADMIN PANEL
  ========================== -->

  <div id="panel" class="hidden">

    <div class="admin-shell">

      <!-- HEADER -->

      <div class="admin-top">

        <div class="admin-title">

          <h1>
            مدیریت پایگاه داده
          </h1>

          <p id="who">
            پنل مدیریت شرکت تعاونی عشایری کوه نور
          </p>

        </div>

        <div
          class="row"
          style="flex:0 0 auto"
        >

          <button
            id="previewSite"
            class="admin-btn secondary"
            type="button"
          >
            مشاهده سایت
          </button>

          <button
            id="logout"
            class="admin-btn danger"
            type="button"
          >
            خروج
          </button>

        </div>

      </div>


      <!-- =========================
           MAIN GRID
      ========================== -->

      <div class="admin-grid">


        <!-- =========================
             ASHAYER
        ========================== -->

        <section class="admin-card">

          <h2>
            عشایر؛ سرمایه ملّی
          </h2>

          <div class="field">

            <label>
              عنوان
            </label>

            <input
              id="ashTitle"
              type="text"
            >

          </div>

          <div class="field">

            <label>
              متن کوتاه
            </label>

            <textarea
              id="ashExcerpt"
            ></textarea>

          </div>

          <div class="field">

            <label>
              متن کامل
            </label>

            <textarea
              id="ashBody"
            ></textarea>

          </div>

          <button
            class="admin-btn"
            data-save-content="ashayer"
            type="button"
          >
            ذخیره تغییرات
          </button>

        </section>


        <!-- =========================
             COOPERATIVE
        ========================== -->

        <section class="admin-card">

          <h2>
            چگونگی تعاونی
          </h2>

          <div class="field">

            <label>
              عنوان
            </label>

            <input
              id="coopTitle"
              type="text"
            >

          </div>

          <div class="field">

            <label>
              متن کوتاه
            </label>

            <textarea
              id="coopExcerpt"
            ></textarea>

          </div>

          <div class="field">

            <label>
              متن کامل
            </label>

            <textarea
              id="coopBody"
            ></textarea>

          </div>

          <button
            class="admin-btn"
            data-save-content="cooperative"
            type="button"
          >
            ذخیره تغییرات
          </button>

        </section>


        <!-- =========================
             NEWS
        ========================== -->

        <section class="admin-card full">

          <h2>
            اخبار
          </h2>

          <div class="row">

            <input
              type="hidden"
              id="newsId"
            >

            <div class="field">

              <label>
                عنوان
              </label>

              <input
                id="newsTitle"
                type="text"
              >

            </div>

            <div class="field">

              <label>
                تاریخ
              </label>

              <input
                id="newsDate"
                type="text"
                placeholder="۱۴۰۵/۰۱/۰۱"
              >

            </div>

          </div>


          <div class="field">

            <label>
              خلاصه
            </label>

            <textarea
              id="newsExcerpt"
            ></textarea>

          </div>


          <div class="field">

            <label>
              متن کامل
            </label>

            <textarea
              id="newsBody"
            ></textarea>

          </div>


          <div class="field">

            <label>
              تصاویر خبر
            </label>

            <input
              id="newsImages"
              type="file"
              accept="image/*"
              multiple
            >

            <div id="selectedFiles"></div>

          </div>


          <div class="row">

            <button
              id="saveNews"
              class="admin-btn"
              type="button"
            >
              ذخیره خبر
            </button>

            <button
              id="cancelNews"
              class="admin-btn secondary"
              type="button"
            >
              پاک کردن فرم
            </button>

          </div>


          <div id="newsAdminList"></div>

        </section>


        <!-- =========================
             DOCUMENTS
        ========================== -->

        <section class="admin-card">

          <h2>
            اسناد و مدارک
          </h2>

          <div class="field">

            <label>
              عنوان سند
            </label>

            <input
              id="docTitle"
              type="text"
              placeholder="مثلاً آگهی تأسیس"
            >

          </div>


          <div class="field">

            <label>
              آدرس فایل / تصویر
            </label>

            <input
              id="docUrl"
              type="url"
              placeholder="https://..."
            >

          </div>


          <div class="row">

            <button
              id="saveDoc"
              class="admin-btn"
              type="button"
            >
              افزودن / ذخیره سند
            </button>

            <button
              id="cancelDoc"
              class="admin-btn secondary"
              type="button"
            >
              پاک کردن
            </button>

          </div>


          <div id="docsList"></div>

        </section>


        <!-- =========================
             BUTTONS
        ========================== -->

        <section class="admin-card">

          <h2>
            دکمه‌های سایت
          </h2>


          <div class="field">

            <label>
              بخش
            </label>

            <select id="buttonSection">

              <option value="ashayer">
                عشایر
              </option>

              <option value="cooperative">
                چگونگی تعاونی
              </option>

              <option value="about">
                درباره ما
              </option>

              <option value="documents">
                اسناد و مدارک
              </option>

            </select>

          </div>


          <div class="field">

            <label>
              متن دکمه
            </label>

            <input
              id="buttonLabel"
              type="text"
              placeholder="مثلاً ادامه مطلب"
            >

          </div>


          <div class="field">

            <label>
              مقصد
            </label>

            <input
              id="buttonTarget"
              type="text"
              placeholder="مثلاً ashayer یا یک URL"
            >

          </div>


          <button
            id="saveButton"
            class="admin-btn"
            type="button"
          >
            افزودن دکمه
          </button>


          <div id="buttonsList"></div>

        </section>


        <!-- =========================
             LIVE PREVIEW
        ========================== -->

        <section class="admin-card full">

          <h2>
            پیش‌نمایش سایت
          </h2>

          <iframe
            id="previewFrame"
            class="preview-frame"
            src="index.html"
            title="پیش‌نمایش سایت"
          ></iframe>

        </section>

      </div>


      <div
        id="adminStatus"
        class="status"
      ></div>

    </div>

  </div>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="config.js"></script>

  <script src="admin.js"></script>

</body>
</html>
